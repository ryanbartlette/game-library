<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Visual Check</title>
<style>
:root{--bg:#f6f4ef;--fg:#2b2a27;--mut:#77736b;--card:#fff;--line:#e2ded5;--ok:#2f8f4e;--warn:#b7791f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1e;--fg:#ece9e2;--mut:#a39f97;--card:#25272a;--line:#3a3c40}}
:root[data-theme="dark"]{--bg:#1b1c1e;--fg:#ece9e2;--mut:#a39f97;--card:#25272a;--line:#3a3c40}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}p{margin:6px 0}.mut{color:var(--mut)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
#status{margin:12px 0;font-weight:600}
#frame{position:fixed;left:0;top:0;width:960px;height:540px;border:0;opacity:0;pointer-events:none}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 2px}
.row img{width:100%;display:block;border-radius:6px;border:1px solid var(--line)}
.lab{font-size:13px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
@media (max-width:640px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Visual check: live vs staging</h1>
<p class="mut">Loads the live game, takes a fixed set of camera shots, then does the same for staging, and compares them pixel by pixel on your graphics card. Takes a few minutes. It never touches your save: time of day, season and weather are put back after each run.</p>
<button id="go">Start the check</button>
<div id="status"></div><div id="sum"></div><div id="out"></div>
<iframe id="frame"></iframe>
<script>
const PLACES=[['Ancient tree',W=>{const a=W.__ANC;return [a.x,W.__luca.groundAt(a.x,a.z),a.z]},14,2.4,4],
 ['Bus stop',W=>{const v=new W.__luca.THREE.Vector3();W.__BUSSTOP.getWorldPosition(v);return v.toArray()},9,-.6,2.2],
 ['Bean glade',W=>{const s=W.__QAPI.spot();return [s.x,s.y,s.z]},10,1,3],
 ['Farmhouse',W=>{const v=new W.__luca.THREE.Vector3();W.__MORE.houseIn.g.getWorldPosition(v);return v.toArray()},18,.5,6],
 ['Meadow',W=>[-1.66,9.76,8.55],16,3.6,7],
 ['Stream',W=>{const s=W.__QAPI.spot();return [(s.x+38.58)/2,0,(s.z-6.22)/2]},22,.2,9],
 ['High view',W=>[10,0,-10],60,.9,40],
 ['Forest floor',W=>{const a=W.__ANC;return [a.x-12,W.__luca.groundAt(a.x-12,a.z+8),a.z+8]},6,1.8,1.2]];
const LOOKS=[['Summer day','day','summer',''],['Autumn golden hour','golden','autumn',''],['Winter night, snow','night','winter','snow'],['Spring dawn','dawn','spring',''],['Summer rain','day','summer','rain']];
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const say=t=>{$('status').textContent=t};
async function shoot(url,label){const f=$('frame');f.src=url;say('Loading '+label+'…');
 await new Promise(r=>f.onload=r);const W=f.contentWindow;
 const t0=performance.now();while(!(W.__luca&&W.__worldBuilt)){if(performance.now()-t0>600000)throw new Error(label+' never finished loading');await wait(500)}
 await wait(15000);W.__luca.start();const C=W.__CYCLE;const keep={season:C.season,prog:C.prog()};W.document.body.classList.add('hud-off');
 let cam=null;const ov=W.__camOverride;W.__camOverride=c=>{if(cam){c.position.set(...cam.p);c.lookAt(...cam.t)}};const out={};
 for(const [ln,tod,sea,ev] of LOOKS){say(label+': '+ln);W.__pause=false;C.setSeason(sea,true);C.setT(tod,.5);C.setEvent(ev||null,ev?1:0);await wait(ev?8000:4000);
  for(const [pn,tf,d,a,h] of PLACES){let t;try{t=tf(W)}catch(e){out[ln+'|'+pn]=null;continue}t[1]=+t[1]||0;cam={t:[t[0],t[1]+1,t[2]],p:[t[0]+Math.sin(a)*d,t[1]+h,t[2]+Math.cos(a)*d]};
   W.__pause=false;await wait(2500);W.__pause=true;await wait(100);
   const L=W.__luca;L.camera.updateMatrixWorld(true);if(L.composer)L.composer.render();else L.renderer.render(L.scene,L.camera);
   const src=L.renderer.domElement;const cv=document.createElement('canvas');cv.width=480;cv.height=270;cv.getContext('2d').drawImage(src,0,0,480,270);out[ln+'|'+pn]=cv}}
 W.__pause=false;W.__camOverride=ov;C.setEvent(null,0);C.setT(keep.prog.w,keep.prog.f);if(C.season!==keep.season)C.setSeason(keep.season,true);
 f.src='about:blank';await wait(1500);return out}
function diff(a,b){const A=a.getContext('2d').getImageData(0,0,480,270).data,B=b.getContext('2d').getImageData(0,0,480,270).data;const cv=document.createElement('canvas');cv.width=480;cv.height=270;const x=cv.getContext('2d');const D=x.createImageData(480,270);let n=0;
 for(let i=0;i<A.length;i+=4){const m=Math.max(Math.abs(A[i]-B[i]),Math.abs(A[i+1]-B[i+1]),Math.abs(A[i+2]-B[i+2]));const g=A[i]*.3;if(m>12){n++;D.data[i]=255;D.data[i+1]=40;D.data[i+2]=40}else{D.data[i]=D.data[i+1]=D.data[i+2]=g}D.data[i+3]=255}
 x.putImageData(D,0,0);return {pct:100*n/(480*270),cv}}
$('go').onclick=async()=>{$('go').disabled=true;$('out').innerHTML='';$('sum').innerHTML='';
 try{const live=await shoot('/tinks-forest/?mute','the live game');const stg=await shoot('/tinks-forest-next/?mute','staging');
  let worst=0,n=0,big=0;for(const k of Object.keys(live)){const a=live[k],b=stg[k];if(!a||!b)continue;const d=diff(a,b);n++;worst=Math.max(worst,d.pct);if(d.pct>2)big++;
   const cls=d.pct<.5?'ok':d.pct<2?'warn':'bad';const [ln,pn]=k.split('|');
   const el=document.createElement('div');el.innerHTML=`<div class="lab"><b>${ln} · ${pn}</b> <span class="${cls}">${d.pct.toFixed(2)}% of pixels differ</span> <span class="mut">(live · staging · differences in red)</span></div>`;
   const r=document.createElement('div');r.className='row';for(const c of [a,b,d.cv]){const im=new Image();im.src=c.toDataURL('image/jpeg',.85);r.appendChild(im)}el.appendChild(r);$('out').appendChild(el)}
  $('sum').innerHTML=`<p><b>${n} shots compared.</b> Worst: ${worst.toFixed(2)}% of pixels. ${big?'<span class="bad">'+big+' shots differ by more than 2%: look at those below.</span>':'<span class="ok">Nothing differs by more than 2%.</span>'}</p><p class="mut">Birds, squirrels, drifting petals and the cats move between the two runs, so small red specks are expected. What matters is anything that is in one picture and not the other: a tree, a light, a colour.</p>`;
  say('Done.')}catch(e){say('Stopped: '+e.message)}$('go').disabled=false};
</script></main></body></html>
